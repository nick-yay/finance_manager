spring.application.name=finance_manager

spring.datasource.url=jdbc:postgresql://localhost:5432/finance_manager_db
spring.datasource.username=${DB_USERNAME:finance_manager_user}
spring.datasource.password=${DB_PASSWORD:finance_manager_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.token.secret=${JWT_SECRET:fin4nc3_f10w_g30}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
